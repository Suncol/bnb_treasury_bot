name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # Explicit bash enables pipefail, so tee cannot hide a pytest failure.
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      ALERT_WEBHOOK_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install and check dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          .venv/bin/python -m pip check

      - name: Record test environment
        run: |
          mkdir -p test-results
          .venv/bin/python --version | tee test-results/environment.txt
          .venv/bin/python -m pip --version | tee -a test-results/environment.txt
          .venv/bin/python -m pip freeze | tee -a test-results/environment.txt

      - name: Run all offline tests
        # Leave time for report upload before the overall job timeout.
        timeout-minutes: 15
        run: |
          .venv/bin/python -m pytest -v -ra --tb=short --color=no \
            --durations=20 --junitxml=test-results/pytest.xml \
            -o faulthandler_timeout=300 \
            --disable-socket --allow-unix-socket \
            2>&1 | tee test-results/pytest.log

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-python-3.11-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
